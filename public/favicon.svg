<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Quota Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Outer Subtle Ring Border -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Quota "Q" Ring (Circular Gauge Track) -->
  <circle cx="62" cy="58" r="34" fill="none" stroke="#1e40af" stroke-width="8" stroke-linecap="round" />
  
  <!-- Quota "Q" Ring (Active Progress Arc) -->
  <path d="M 62 24 A 34 34 0 1 1 37.9 33.9" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- "Q" Accent Dash / Tail breaking through bottom right -->
  <path d="M 76 72 L 96 92" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />

  <!-- Lightning Bolt Symbol (Warmup & Speed) -->
  <path d="M 64 36 L 50 58 L 61 58 L 57 80 L 76 54 L 64 54 Z" fill="url(#boltGrad)" />
</svg>